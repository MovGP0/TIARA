[workspace]
members = ["crates/tiara-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/MovGP0/TIARA"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

[package]
name = "tiara"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room circuit design and simulation application"
license.workspace = true
repository.workspace = true

[dependencies]
tiara-core = { path = "crates/tiara-core" }

[lints]
workspace = true

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
