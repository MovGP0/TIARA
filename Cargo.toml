[workspace]
members = ["crates/tiara-core", "crates/tiara-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/MovGP0/TIARA"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
csv = "1.4.0"
glob = "0.3.3"
iced = "0.13.1"
iced_aw = { version = "0.12.2", default-features = false, features = ["menu"] }
num-traits = "0.2.19"
rfd = "0.17.2"
serde_json = "1.0.145"
walkdir = "2.5.0"
xmltree = "0.12.0"

[package]
name = "tiara"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A clean-room circuit design and simulation application"
license.workspace = true
repository.workspace = true

[dependencies]
iced.workspace = true
tiara-core = { path = "crates/tiara-core" }
tiara-ui = { path = "crates/tiara-ui" }

[lints]
workspace = true

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
